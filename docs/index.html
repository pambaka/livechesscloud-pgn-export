<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveChessCloud PGN Exporter</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <form>
      <div>
        <label for="tournament_id">Tournament ID:</label>
        <input
          id="tournament_id"
          type="text"
          placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          required
        />
      </div>
      <button type="submit">Show rounds</button>
    </form>
    <div id="response" hidden>
      <div class="rounds-bar">
        <p>Round:</p>
        <div id="rounds"></div>
      </div>
      <div id="pairs"></div>
    </div>
  </body>
</html>
