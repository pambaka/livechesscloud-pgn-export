<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveChessCloud PGN Exporter</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <form>
      <div>
        <label for="tournament_id">Tournament ID:</label>
        <input
          id="tournament_id"
          type="text"
          placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          required
        />
      </div>
      <button type="submit">Show rounds</button>
    </form>
    <p id="tournament-status" class="status"></p>
    <div id="response" hidden>
      <div class="rounds-bar">
        <p>Round:</p>
        <div id="rounds"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all" /></th>
            <th>No.</th>
            <th>White</th>
            <th>Black</th>
          </tr>
        </thead>
        <tbody id="pairs"></tbody>
      </table>
      <div class="download-bar">
        <div>
          <p>Selected: <span id="counter">0</span></p>
        </div>
        <button id="pgn-button" disabled>Get PGN</button>
      </div>
      <p id="pgn-status" class="status"></p>
      <ul id="pgn-list"></ul>
      <button id="download-button" disabled="true">Download all PGN</button>
    </div>
    <template id="row-template">
      <tr>
        <td><input type="checkbox" /></td>
        <th></th>
        <td class="white"></td>
        <td class="black"></td>
      </tr>
    </template>
    <template id="pgn-template">
      <li class="pgn-item">
        <details>
          <summary>
            <span class="pgn-title"></span>
            <span class="round-board"></span>
            <span class="white"
              ><span class="dot" role="img" aria-label="White"></span
            ></span>
            <span class="black"
              ><span class="dot" role="img" aria-label="Black"></span
            ></span>
          </summary>
          <pre class="pgn-text"></pre>
        </details>
        <button
          type="button"
          class="copy-button"
          aria-label="Copy PGN"
          title="Copy PGN"
        >
          <svg
            class="icon-copy"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="8" y="8" width="13" height="13" rx="2" />
            <path d="M4 16 v-10 a2 2 0 0 1 2 -2 h10" />
            <path class="icon-check" d="M11.5 14.5 l2 2 l4 -4" />
            <path class="icon-cross" d="M12 12 l5 5 M17 12 l-5 5" />
          </svg>
        </button>
      </li>
    </template>
  </body>
</html>
