<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveChessCloud PGN Exporter</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <form>
      <div>
        <label for="tournament_id">Tournament ID:</label>
        <input
          id="tournament_id"
          type="text"
          placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          required
        />
      </div>
      <button type="submit">Show rounds</button>
    </form>
    <div id="response" hidden>
      <div class="rounds-bar">
        <p>Round:</p>
        <div id="rounds"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all" /></th>
            <th>No.</th>
            <th>White</th>
            <th>Black</th>
          </tr>
        </thead>
        <tbody id="pairs"></tbody>
      </table>
      <div class="download-bar">
        <div>
          <p>Selected: <span id="counter">0</span></p>
        </div>
        <button id="pgn-button" disabled>Get PGN</button>
      </div>
    </div>
    <template id="row-template">
      <tr>
        <td><input type="checkbox" /></td>
        <th></th>
        <td class="white"></td>
        <td class="black"></td>
      </tr>
    </template>
  </body>
</html>
